<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>1С: Квиз - Лабораторная №6</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>

    <script>
        // БЛОКИРОВКА ЗУМА (Android/iOS)
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            let now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, false);
    </script>
</head>
<body oncontextmenu="return false;">

    <!-- ЛЕЙБЛ: КТО В СЕТИ (СВЯЗКА ВСЕХ) -->
    <div id="status-bar-players">
        <span class="indicator">●</span> 
        <span id="players-online-count">0</span> участников: 
        <div id="players-names-line">Ожидание...</div>
    </div>

    <!-- ПАНЕЛЬ УЧИТЕЛЯ -->
    <nav id="admin-pwa-bar">
        <div id="auth-lock">
            <input type="password" id="pin" placeholder="PIN">
            <button onclick="Admin.login()">OK</button>
        </div>
        <div id="adm-tools" style="display:none;">
            <button class="a-btn" onclick="Admin.setStep('lobby')">ЛОББИ</button>
            <button class="a-btn primary" onclick="Admin.runAuto()">СТАРТ (12 ВОПРОСОВ)</button>
            <button class="a-btn danger" onclick="Admin.reset()">СБРОС</button>
        </div>
    </nav>

    <div id="app-viewport">
        
        <!-- ЭКРАН 1: ВХОД / ЛОББИ -->
        <section id="view-lobby" class="screen active">
            <div class="k-logo">1C: Quiz</div>
            <div id="join-card" class="glass-card">
                <p style="color:#333; margin-bottom:10px; font-weight:600;">Вы вошли в систему!</p>
                <input type="text" id="p-nick" placeholder="Ваше имя (необязательно)">
                <button onclick="User.manualJoin()" class="btn-hit">ИЗМЕНИТЬ НИК</button>
                <p id="current-name-display" style="color:#666; font-size:12px; margin-top:10px;"></p>
            </div>
            <div id="player-tags" class="scroll-zone"></div>
        </section>

        <!-- ЭКРАН 2: ПРИГОТОВЬТЕСЬ -->
        <section id="view-getready" class="screen">
            <h1 class="prep-text pulse">ПРИГОТОВЬТЕСЬ!</h1>
            <p>Следующий вопрос на экране через пару секунд</p>
        </section>

        <!-- ЭКРАН 3: ВОПРОС -->
        <section id="view-game" class="screen">
            <div class="question-overlay">
                <h2 id="q-text">Загрузка...</h2>
            </div>
            <div class="game-hud">
                <div class="timer-orb"><span id="timer-sec">20</span></div>
                <div class="stats-pill"><span id="ans-count">0</span> ответов</div>
            </div>
            <div class="answers-grid" id="ans-grid">
                <button class="ans-btn r" onclick="User.hit(0)"><span class="s">▲</span><span class="t"></span></button>
                <button class="ans-btn b" onclick="User.hit(1)"><span class="s">◆</span><span class="t"></span></button>
                <button class="ans-btn y" onclick="User.hit(2)"><span class="s">●</span><span class="t"></span></button>
                <button class="ans-btn g" onclick="User.hit(3)"><span class="s">■</span><span class="t"></span></button>
            </div>
        </section>

        <!-- ЭКРАН 4: РЕЗУЛЬТАТЫ РАУНДА -->
        <section id="view-results" class="screen">
            <div class="feedback-card">
                <h1>РЕЙТИНГ</h1>
                <div class="stats-container">
                    <div class="stat-col"><span id="count-0">0</span><div id="bar-0" class="bar r-bar"></div><span>▲</span></div>
                    <div class="stat-col"><span id="count-1">0</span><div id="bar-1" class="bar b-bar"></div><span>◆</span></div>
                    <div class="stat-col"><span id="count-2">0</span><div id="bar-2" class="bar y-bar"></div><span>●</span></div>
                    <div class="stat-col"><span id="count-3">0</span><div id="bar-3" class="bar g-bar"></div><span>■</span></div>
                </div>
            </div>
            <div id="round-leaderboard" class="scroll-list"></div>
        </section>

        <!-- ЭКРАН 5: ФИНАЛ -->
        <section id="view-podium" class="screen">
            <div class="k-logo">🏆 ФИНАЛ 🏆</div>
            <div id="podium-final" class="scroll-list"></div>
            
            <div class="donation-block" style="margin-top:20px;">
                <button class="btn-hit" style="background:#ffcc00; color:#000; padding:10px 20px; width:auto;" onclick="showDonation()">НА ХЛЕБ 🍞</button>
            </div>
            <button class="btn-hit" style="margin-top:15px; width:auto; font-size:12px; background:#555;" onclick="location.reload()">ЗАНОВО</button>
        </section>

    </div>

    <!-- МОДАЛКА ДОНАТА -->
    <div id="bread-modal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <h2>На пропитание студенту</h2>
            <p>Буду благодарен за любую поддержку проекта!</p>
            <div class="qr-box">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://github.com/jakemonmercer-spec" alt="QR">
            </div>
            <button class="btn-hit" onclick="document.getElementById('bread-modal').style.display='none'">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script src="sounds.js"></script>
    <script src="game.js"></script>

</body>
</html>
