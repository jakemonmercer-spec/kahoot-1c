<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1C: Kahoot Clone</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
</head>
<body>

    <div id="app">
        <!-- 1. ЛОББИ (Вход) -->
        <section id="lobby" class="screen">
            <div class="kahoot-logo">1C: Quiz</div>
            <div class="card">
                <input type="text" id="username" placeholder="Nickname">
                <button class="join-btn" onclick="joinGame()">ПРИСОЕДИНИТЬСЯ</button>
            </div>
            <div id="player-list-container">
                <h3>Игроки в лобби:</h3>
                <div id="player-list"></div>
            </div>
        </section>

        <!-- 2. ЭКРАН ВОПРОСА -->
        <section id="question-screen" class="screen" style="display:none;">
            <div class="q-header">
                <h1 id="question-text">Загрузка вопроса...</h1>
            </div>
            
            <div class="main-area">
                <div class="timer-side">
                    <div id="timer-val">20</div>
                </div>
                <div class="image-placeholder">
                    <img src="https://1c.ru/images/logos/1c_eng.png" alt="1C">
                </div>
                <div class="stats-side">
                    <div id="answers-count">0</div>
                    <div>Answers</div>
                </div>
            </div>

            <div class="answers-grid" id="answers-grid">
                <!-- Кнопки Kahoot -->
                <button class="ans-btn r" onclick="submitAns(0)"><span class="shape">▲</span> <span class="text"></span></button>
                <button class="ans-btn b" onclick="submitAns(1)"><span class="shape">◆</span> <span class="text"></span></button>
                <button class="ans-btn y" onclick="submitAns(2)"><span class="shape">●</span> <span class="text"></span></button>
                <button class="ans-btn g" onclick="submitAns(3)"><span class="shape">■</span> <span class="text"></span></button>
            </div>
        </section>

        <!-- 3. ТАБЛИЦА ЛИДЕРОВ (Scoreboard) -->
        <section id="scoreboard" class="screen" style="display:none;">
            <h1>Scoreboard</h1>
            <ul id="leader-list"></ul>
        </section>

        <!-- ПАНЕЛЬ ВЕДУЩЕГО (внизу) -->
        <footer class="admin-panel">
            <div id="admin-controls"></div>
            <button class="reset-btn" onclick="resetAll()">RESET GAME</button>
        </footer>
    </div>

    <script src="firebase-config.js"></script>
    <script src="game.js"></script>
</body>
</html>
