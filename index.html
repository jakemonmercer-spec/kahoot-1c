<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>1C Enterprise Quiz Pro - Lab 6</title>
    
    <!-- Подключение внешнего тяжелого CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Шрифты Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (Compat версия для максимальной надежности на GitHub) -->
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        // --- ЦЕНТРАЛЬНОЕ ЯДРО ПРИВЯЗКИ (Firebase) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBrPKRi5NWA7JRcdbA2YLO4HPR3ULaBlGk",
            authDomain: "quiz1c.firebaseapp.com",
            databaseURL: "https://quiz1c-default-rtdb.firebaseio.com",
            projectId: "quiz1c",
            storageBucket: "quiz1c.firebasestorage.app",
            messagingSenderId: "660786627580",
            appId: "1:660786627580:web:6a552159559d0eef426879",
            measurementId: "G-JYTEXXW2BD"
        };

        // Инициализация базы данных мгновенно
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>
</head>
<body>

    <!-- 1. ПАНЕЛЬ УПРАВЛЕНИЯ ПРЕПОДАВАТЕЛЯ (Админка) -->
    <nav id="admin-pwa-bar">
        <div id="auth-lock">
            <input type="password" id="pin" placeholder="PIN">
            <button onclick="Admin.login()">Вход</button>
        </div>
        <div id="adm-tools" style="display:none;">
            <button class="a-btn" onclick="Admin.setStep('lobby')">ЛОББИ</button>
            <button class="a-btn primary" onclick="Admin.runAuto()">АВТО-СТАРТ КВИЗА</button>
            <button class="a-btn danger" onclick="Admin.reset()">СБРОС ВСЕЙ СИСТЕМЫ</button>
            <span style="color:#ffcc00; font-size:10px; margin-left:15px; font-weight:800;">LIVE SYNC ON</span>
        </div>
    </nav>

    <!-- 2. ГЛАВНЫЙ КОНТЕЙНЕР ПРИЛОЖЕНИЯ -->
    <div id="app-viewport">
        
        <!-- ЭКРАН: ЛОББИ (Вход) -->
        <section id="view-lobby" class="screen active">
            <div class="k-logo">1C: Quiz</div>
            
            <div id="join-card" class="glass-card">
                <input type="text" id="p-nick" placeholder="Твое имя...">
                <button onclick="User.join()" class="btn-hit">ИГРАТЬ</button>
            </div>
            
            <div id="online-counter" style="margin-top: 20px; font-weight: 800;">Ожидание подключения...</div>
            
            <!-- Сюда JS выводит ВСЕХ игроков (полный список) -->
            <div id="player-tags" style="width: 100%; max-width: 900px; padding: 20px;"></div>
        </section>

        <!-- ЭКРАН: ПРИГОТОВЬТЕСЬ (Get Ready) -->
        <section id="view-getready" class="screen">
            <h1 class="prep-text pulse" style="font-size: clamp(3rem, 10vw, 6rem);">ПРИГОТОВЬТЕСЬ!</h1>
            <div class="winner-row place-1" style="margin-top: 30px; font-size: 1.5rem;">
                Следующий вопрос на экране...
            </div>
        </section>

        <!-- ЭКРАН: ВОПРОС (Game) -->
        <section id="view-game" class="screen">
            <div class="question-overlay">
                <h2 id="q-text">Загрузка вопроса по Лабораторной работе №6...</h2>
            </div>
            
            <div class="game-hud">
                <div class="timer-orb" id="t-orb">
                    <span id="timer-sec">20</span>
                </div>
                <div class="stats-pill">
                    <span id="ans-count">0</span> ответов принято
                </div>
            </div>

            <div class="answers-grid" id="ans-grid">
                <!-- Сетка Kahoot: Красный, Синий, Желтый, Зеленый -->
                <button class="ans-btn r" onclick="User.hit(0)">
                    <span class="s">▲</span><span class="t"></span>
                </button>
                <button class="ans-btn b" onclick="User.hit(1)">
                    <span class="s">◆</span><span class="t"></span>
                </button>
                <button class="ans-btn y" onclick="User.hit(2)">
                    <span class="s">●</span><span class="t"></span>
                </button>
                <button class="ans-btn g" onclick="User.hit(3)">
                    <span class="s">■</span><span class="t"></span>
                </button>
            </div>
        </section>

        <!-- ЭКРАН: СТАТИСТИКА И РЕЙТИНГ (Results) -->
        <section id="view-results" class="screen">
            <div class="feedback-card">
                <h1 id="fb-main">Время вышло!</h1>
                <p>Статистика ответов группы:</p>
                
                <!-- ГРАФИЧЕСКИЕ СТОЛБИКИ (STATS BARS) -->
                <div class="stats-container" style="display:flex; align-items:flex-end; justify-content:center; gap:15px; height: 150px; margin-top: 20px;">
                    <div style="display:flex; flex-direction:column; align-items:center;">
                        <span id="count-0" style="color:#000; font-weight:800;">0</span>
                        <div id="bar-0" style="width:40px; background:var(--r); height:5px; border-radius:4px 4px 0 0; transition: height 0.5s ease;"></div>
                        <span style="font-size:10px;">▲</span>
                    </div>
                    <div style="display:flex; flex-direction:column; align-items:center;">
                        <span id="count-1" style="color:#000; font-weight:800;">0</span>
                        <div id="bar-1" style="width:40px; background:var(--b); height:5px; border-radius:4px 4px 0 0; transition: height 0.5s ease;"></div>
                        <span style="font-size:10px;">◆</span>
                    </div>
                    <div style="display:flex; flex-direction:column; align-items:center;">
                        <span id="count-2" style="color:#000; font-weight:800;">0</span>
                        <div id="bar-2" style="width:40px; background:var(--y); height:5px; border-radius:4px 4px 0 0; transition: height 0.5s ease;"></div>
                        <span style="font-size:10px;">●</span>
                    </div>
                    <div style="display:flex; flex-direction:column; align-items:center;">
                        <span id="count-3" style="color:#000; font-weight:800;">0</span>
                        <div id="bar-3" style="width:40px; background:var(--g); height:5px; border-radius:4px 4px 0 0; transition: height 0.5s ease;"></div>
                        <span style="font-size:10px;">■</span>
                    </div>
                </div>
            </div>

            <!-- Список ВСЕХ игроков с текущими баллами -->
            <div id="round-leaderboard" style="width: 100%; max-width: 600px; overflow-y: auto; max-height: 40vh; padding: 10px;">
                <!-- Сюда JS отрисует рейтинг -->
            </div>
        </section>

        <!-- ЭКРАН: ФИНАЛЬНЫЙ ПОДИУМ -->
        <section id="view-podium" class="screen">
            <div class="k-logo pulse" style="font-size: 4rem;">🏆 ФИНАЛ 🏆</div>
            <!-- Сюда JS выведет полный список победителей -->
            <div id="podium-final" style="width: 100%; max-width: 700px; overflow-y: auto; max-height: 50vh; padding: 20px;"></div>
            
            <button class="btn-hit" style="margin-top: 30px; width: auto; padding: 15px 60px;" onclick="location.reload()">НОВАЯ ИГРА</button>
        </section>

    </div>

    <!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ (СТРОГИЙ ПОРЯДОК) -->
    <script src="sounds.js"></script>
    <script src="game.js"></script>

</body>
</html>
