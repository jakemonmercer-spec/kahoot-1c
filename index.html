<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Продвинутые настройки отображения и защита от масштабирования -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>1C: Enterprise Quiz Ultimate Edition</title>
    
    <!-- Стили и Шрифты -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK Compat (Надежная связь с облаком Google) -->
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        // --- ЦЕНТРАЛЬНОЕ ЯДРО СВЯЗИ (FIREBASE CONFIG) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBrPKRi5NWA7JRcdbA2YLO4HPR3ULaBlGk",
            authDomain: "quiz1c.firebaseapp.com",
            databaseURL: "https://quiz1c-default-rtdb.firebaseio.com",
            projectId: "quiz1c",
            storageBucket: "quiz1c.firebasestorage.app",
            messagingSenderId: "660786627580",
            appId: "1:660786627580:web:6a552159559d0eef426879",
            measurementId: "G-JYTEXXW2BD"
        };

        // Мгновенная инициализация базы
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>
</head>
<body oncontextmenu="return false;">

    <!-- 1. ПАНЕЛЬ ПРЕПОДАВАТЕЛЯ (ADMIN) -->
    <nav id="admin-pwa-bar">
        <div id="auth-lock">
            <input type="password" id="pin" placeholder="PIN">
            <button onclick="Admin.login()">ВХОД</button>
        </div>
        <div id="adm-tools" style="display:none;">
            <button class="a-btn" onclick="Admin.setStep('lobby')">ЛОББИ</button>
            <button class="a-btn primary" onclick="Admin.runAuto()">АВТО-СТАРТ (12 ВОПРОСОВ)</button>
            <button class="a-btn danger" onclick="Admin.reset()">ПОЛНЫЙ СБРОС</button>
            <span id="sync-status">● SYNC ACTIVE</span>
        </div>
    </nav>

    <!-- 2. ГЛАВНОЕ ОКНО ПРИЛОЖЕНИЯ -->
    <div id="app-viewport">
        
        <!-- ЭКРАН: ЛОББИ (Регистрация всех игроков) -->
        <section id="view-lobby" class="screen active">
            <div class="k-logo">1C: Quiz</div>
            
            <div id="join-card" class="glass-card">
                <input type="text" id="p-nick" placeholder="Твое имя...">
                <button onclick="User.join()" class="btn-hit">ИГРАТЬ</button>
            </div>
            
            <div id="online-counter">Подключение к 1С серверу...</div>
            
            <!-- Прокручиваемый список ВСЕХ студентов -->
            <div id="player-tags" class="scroll-zone"></div>
        </section>

        <!-- ЭКРАН: ПРИГОТОВЬТЕСЬ (Countdown) -->
        <section id="view-getready" class="screen">
            <h1 class="prep-text pulse">ПРИГОТОВЬТЕСЬ...</h1>
            <div id="player-score-info" class="winner-row place-1">
                Следующий вопрос через пару секунд!
            </div>
        </section>

        <!-- ЭКРАН: ВОПРОС (Игровой процесс) -->
        <section id="view-game" class="screen">
            <div class="question-overlay">
                <h2 id="q-text">Загрузка вопроса...</h2>
            </div>
            
            <div class="game-hud">
                <div class="timer-orb">
                    <span id="timer-sec">20</span>
                </div>
                <div class="stats-pill">
                    <span id="ans-count">0</span> ответов получено
                </div>
            </div>

            <div class="answers-grid" id="ans-grid">
                <!-- Кахут-сетка с геометрическими символами -->
                <button class="ans-btn r" onclick="User.hit(0)">
                    <span class="s">▲</span><span class="t"></span>
                </button>
                <button class="ans-btn b" onclick="User.hit(1)">
                    <span class="s">◆</span><span class="t"></span>
                </button>
                <button class="ans-btn y" onclick="User.hit(2)">
                    <span class="s">●</span><span class="t"></span>
                </button>
                <button class="ans-btn g" onclick="User.hit(3)">
                    <span class="s">■</span><span class="t"></span>
                </button>
            </div>
        </section>

        <!-- ЭКРАН: РЕЗУЛЬТАТЫ (Статистика + Рейтинг 0 баллов) -->
        <section id="view-results" class="screen">
            <div class="feedback-card">
                <h1 id="fb-main">Время вышло!</h1>
                
                <!-- ГРАФИКИ СТАТИСТИКИ (Столбики) -->
                <div class="stats-container">
                    <div class="stat-col"><span id="count-0">0</span><div id="bar-0" class="bar r-bar"></div><span>▲</span></div>
                    <div class="stat-col"><span id="count-1">0</span><div id="bar-1" class="bar b-bar"></div><span>◆</span></div>
                    <div class="stat-col"><span id="count-2">0</span><div id="bar-2" class="bar y-bar"></div><span>●</span></div>
                    <div class="stat-col"><span id="count-3">0</span><div id="bar-3" class="bar g-bar"></div><span>■</span></div>
                </div>
            </div>

            <!-- Рейтинг ВСЕЙ группы -->
            <div id="round-leaderboard" class="scroll-list"></div>
        </section>

        <!-- ЭКРАН: ФИНАЛЬНЫЙ ПОДИУМ -->
        <section id="view-podium" class="screen">
            <div class="k-logo">🏆 ФИНАЛ 🏆</div>
            
            <div id="podium-final" class="scroll-list" style="max-height: 45vh;">
                <!-- Итоговые баллы всей группы -->
            </div>
            
            <!-- СЕКЦИЯ ПОЖЕРТВОВАНИЯ -->
            <div class="donation-zone" style="margin-top: 20px;">
                <button class="btn-hit" style="background: #ffcc00; color: #000; width: auto; padding: 15px 30px;" onclick="showDonation()">
                    ПОЖЕРТВОВАТЬ НА ХЛЕБ 🍞
                </button>
            </div>
            
            <button class="btn-hit" style="margin-top: 15px; width: auto; font-size: 0.8rem; background: #444;" onclick="location.reload()">НОВАЯ ИГРА</button>
        </section>

    </div>

    <!-- МОДАЛЬНОЕ ОКНО С QR-КОДОМ -->
    <div id="bread-modal" class="modal-overlay">
        <div class="modal-card">
            <h2>Спасибо за поддержку!</h2>
            <p>Ваше пожертвование поможет студенту не умереть с голоду во время сессии.</p>
            <div class="qr-container">
                <!-- Сюда вставь ссылку на свою картинку QR-кода -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://github.com/jakemonmercer-spec" alt="QR Оплата">
            </div>
            <button class="btn-hit" onclick="document.getElementById('bread-modal').style.display='none'">ЗАКРЫТЬ</button>
        </div>
    </div>

    <!-- СКРИПТЫ -->
    <script src="sounds.js"></script>
    <script src="game.js"></script>

</body>
</html>
