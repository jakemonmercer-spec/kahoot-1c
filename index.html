<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1C: Kahoot Auto-Pilot</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <style>
        :root { --p: #46178f; --r: #e21b3c; --b: #1368ce; --y: #d89e00; --g: #26890c; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--p); color: white; font-family: 'Montserrat', sans-serif; height: 100vh; overflow: hidden; }

        /* Панель админа сверху */
        #admin-bar { background: #000; padding: 10px; display: flex; justify-content: center; gap: 10px; border-bottom: 2px solid #ffcc00; z-index: 1000; position: relative;}
        .a-btn { border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .a-btn:active { transform: scale(0.9); }
        .start-btn { background: var(--g); color: white; }
        .reset-btn { background: #444; color: white; }

        /* Экраны */
        .view { display: none; width: 100%; height: calc(100vh - 60px); flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .view.active { display: flex; }

        /* Лобби и Вход */
        .k-logo { font-size: clamp(40px, 10vw, 80px); font-weight: 900; margin-bottom: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; color: #333; width: 100%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 15px; font-size: 18px; margin-bottom: 10px; border: 2px solid #ddd; border-radius: 8px; text-align: center; }
        .btn-join { width: 100%; background: #333; color: white; padding: 15px; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; }

        #lobby-players { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; max-height: 200px; overflow-y: auto; }
        .chip { background: white; color: black; padding: 8px 15px; border-radius: 5px; font-weight: bold; font-size: 18px; animation: pop 0.3s ease; }

        /* Вопрос */
        .q-box { background: white; color: black; width: 100%; padding: 20px; text-align: center; position: absolute; top: 55px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .timer-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.2); position: absolute; top: 135px; }
        #timer-fill { width: 100%; height: 100%; background: #00f2ff; transition: width 1s linear; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 1000px; height: 40vh; margin-top: 100px; }
        .ans-btn { border: none; border-radius: 8px; color: white; font-size: clamp(16px, 4vw, 24px); font-weight: bold; display: flex; align-items: center; padding: 0 20px; cursor: pointer; }
        .ans-btn.r { background: var(--r); } .ans-btn.b { background: var(--b); }
        .ans-btn.y { background: var(--y); } .ans-btn.g { background: var(--g); }
        .shp { margin-right: 15px; font-size: 35px; opacity: 0.8; }

        /* Результаты и Подиум */
        .pod-item { background: rgba(255,255,255,0.15); width: 100%; max-width: 450px; padding: 15px; margin: 5px; border-radius: 10px; display: flex; justify-content: space-between; font-size: 20px; border-left: 10px solid #fff; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; height: 50vh; }
            .ans-btn { height: 60px; }
        }

        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- АДМИН-ПАНЕЛЬ -->
    <nav id="admin-bar">
        <div id="auth-zone">
            <input type="password" id="adm-pass" placeholder="Код" style="width:60px; padding:5px; font-size:12px; margin:0;">
            <button class="a-btn" onclick="authAdmin()">OK</button>
        </div>
        <div id="adm-ctrl" style="display:none;">
            <button class="a-btn" onclick="updateStep('lobby')">ЛОББИ</button>
            <button class="a-btn start-btn" onclick="runAutoGame()">СТАРТ КВИЗ</button>
            <button class="a-btn reset-btn" onclick="resetSystem()">СБРОС</button>
        </div>
    </nav>

    <div id="app">
        <!-- 0. ОЖИДАНИЕ -->
        <section id="view-wait" class="view active">
            <div class="k-logo">1C: QUIZ</div>
            <div class="pulse">Ожидание преподавателя...</div>
        </section>

        <!-- 1. ЛОББИ -->
        <section id="view-lobby" class="view">
            <div id="join-form">
                <div class="card">
                    <h2>Nickname жазыңыз:</h2>
                    <input type="text" id="nick-input" placeholder="Аты-жөнү">
                    <button class="btn-join" onclick="enterGame()">КИРҮҮ</button>
                </div>
            </div>
            <div id="lobby-players"></div>
        </section>

        <!-- 2. ИГРА -->
        <section id="view-game" class="view">
            <div class="q-box"><h2 id="q-text">Загрузка...</h2></div>
            <div class="timer-bar"><div id="timer-fill"></div></div>
            <div style="margin-top: 80px; font-size: 20px;">⏱ <span id="timer-sec">20</span></div>
            <div class="grid" id="ans-grid">
                <button class="ans-btn r" onclick="sendHit(0)"><span class="shp">▲</span><span class="t"></span></button>
                <button class="ans-btn b" onclick="sendHit(1)"><span class="shp">◆</span><span class="t"></span></button>
                <button class="ans-btn y" onclick="sendHit(2)"><span class="shp">●</span><span class="t"></span></button>
                <button class="ans-btn g" onclick="sendHit(3)"><span class="shp">■</span><span class="t"></span></button>
            </div>
        </section>

        <!-- 3. РЕЗУЛЬТАТЫ ВОПРОСА -->
        <section id="view-results" class="view">
            <h1 id="correct-label" style="color:var(--g)">Время вышло!</h1>
            <div id="score-now" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
        </section>

        <!-- 4. ФИНАЛЬНЫЙ ПОДИУМ -->
        <section id="view-podium" class="view">
            <h1 style="font-size: 50px;">🏆 ТОР-5 🏆</h1>
            <div id="podium-final" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
        </section>
    </div>

<script>
    // --- 1. КОНФИГ ---
    const firebaseConfig = {
        apiKey: "AIzaSyBrPKRi5NWA7JRcdbA2YLO4HPR3ULaBlGk",
        authDomain: "quiz1c.firebaseapp.com",
        databaseURL: "https://quiz1c-default-rtdb.firebaseio.com",
        projectId: "quiz1c",
        storageBucket: "quiz1c.firebasestorage.app",
        messagingSenderId: "660786627580",
        appId: "1:660786627580:web:6a552159559d0eef426879"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const quizData = [
        { q: "СКД деген эмне?", a: ["Отчетторду түзүүчү инструмент", "Программа коду", "Справочник", "Макет"], c: 0 },
        { q: "Материалы отчетунда кайсы виртуалдык таблица колдонулат?", a: ["Остатки", "Обороты", "ОстаткиИОбороты", "Продажи"], c: 2 },
        { q: "Отчеттун макети эмнени аныктайт?", a: ["Запросту", "Визуалдык көрүнүштү", "Параметрди", "Ролду"], c: 1 },
        { q: "Начало периода кайсы жерде көрсөтүлөт?", a: ["Пользовательские настройки", "Свойства справочника", "Модуль объекта", "Запрос"], c: 0 },
        { q: "Запрос конструкторунда «>>» баскычы эмне кылат?", a: ["Баарын өчүрөт", "Бардык талааларды тандайт", "Отчетту жабат", "Кодду текшерет"], c: 1 }
    ];

    let userNick = ""; let currentQIdx = -1; let timerObj; let hitAllowed = false;

    // --- 2. АДМИН КОМАНДЫ ---
    function authAdmin() {
        if(document.getElementById('adm-pass').value === "123") {
            document.getElementById('auth-zone').style.display = 'none';
            document.getElementById('adm-ctrl').style.display = 'flex';
        }
    }

    function updateStep(s) { database.ref('state').update({ step: s }); }

    async function runAutoGame() {
        for(let i=0; i < quizData.length; i++) {
            await database.ref('state').update({ step: 'game', qIdx: i });
            await new Promise(res => setTimeout(res, 20500)); // 20 сек вопрос
            await database.ref('state').update({ step: 'results' });
            await new Promise(res => setTimeout(res, 5000)); // 5 сек рейтинг
        }
        updateStep('podium');
    }

    function resetSystem() {
        database.ref('/').set({ state: { step: 'wait', qIdx: -1 }, players: {} });
        location.reload();
    }

    // --- 3. ЛОГИКА ИГРОКА ---
    function enterGame() {
        userNick = document.getElementById('nick-input').value.trim();
        if(!userNick) return alert("Имя введите!");
        const pRef = database.ref('players/' + userNick);
        pRef.set({ score: 0 });
        pRef.onDisconnect().remove();
        document.getElementById('join-form').innerHTML = "<h2 class='pulse' style='color:white'>СЕРВЕРГЕ КОШУЛДУҢУЗ!</h2>";
    }

    function sendHit(idx) {
        if(!hitAllowed) return;
        hitAllowed = false;
        document.getElementById('ans-grid').style.opacity = "0.3";
        if(idx === quizData[currentQIdx].c) {
            let s = parseInt(document.getElementById('timer-sec').innerText);
            database.ref('players/' + userNick + '/score').transaction(sc => (sc || 0) + (500 + s*25));
        }
    }

    // --- 4. СИНХРОНИЗАЦИЯ ---
    database.ref('state').on('value', snap => {
        const state = snap.val() || {};
        currentQIdx = state.qIdx;
        switchView('view-' + state.step);
        if(state.step === 'game') startQuestion(state.qIdx);
    });

    database.ref('players').on('value', snap => {
        const pData = snap.val() || {};
        const lobby = document.getElementById('lobby-players');
        const scoreNow = document.getElementById('score-now');
        const podium = document.getElementById('podium-final');
        lobby.innerHTML = ""; scoreNow.innerHTML = ""; podium.innerHTML = "";

        const sorted = Object.entries(pData).sort((a,b) => b[1].score - a[1].score);
        sorted.forEach(([n]) => lobby.innerHTML += `<div class="chip">${n}</div>`);
        sorted.slice(0, 5).forEach(([n, d], i) => {
            const item = `<div class="pod-item"><span>${i+1}. ${n}</span> <b>${d.score}</b></div>`;
            scoreNow.innerHTML += item;
            podium.innerHTML += item;
        });
    });

    function startQuestion(idx) {
        hitAllowed = true;
        document.getElementById('ans-grid').style.opacity = "1";
        const q = quizData[idx];
        document.getElementById('q-text').innerText = q.q;
        const btnTs = document.querySelectorAll('.ans-btn .t');
        q.a.forEach((txt, i) => btnTs[i].innerText = txt);
        
        let left = 20;
        document.getElementById('timer-sec').innerText = left;
        document.getElementById('timer-fill').style.width = "100%";
        
        clearInterval(timerObj);
        timerObj = setInterval(() => {
            left--;
            document.getElementById('timer-sec').innerText = left;
            document.getElementById('timer-fill').style.width = (left/20*100) + "%";
            if(left <= 0) { clearInterval(timerObj); hitAllowed = false; }
        }, 1000);
    }

    function switchView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        const target = document.getElementById(id);
        if(target) target.classList.add('active');
    }
</script>
</body>
</html>
