<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>1C: Enterprise Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrPKRi5NWA7JRcdbA2YLO4HPR3ULaBlGk",
            authDomain: "quiz1c.firebaseapp.com",
            databaseURL: "https://quiz1c-default-rtdb.firebaseio.com",
            projectId: "quiz1c",
            storageBucket: "quiz1c.firebasestorage.app",
            messagingSenderId: "660786627580",
            appId: "1:660786627580:web:6a552159559d0eef426879"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>
</head>
<body oncontextmenu="return false;">

    <nav id="admin-pwa-bar">
        <div id="auth-lock">
            <input type="password" id="pin" placeholder="PIN">
            <button onclick="Admin.login()">OK</button>
        </div>
        <div id="adm-tools" style="display:none;">
            <button class="a-btn" onclick="Admin.setStep('lobby')">ЛОББИ</button>
            <button class="a-btn primary" onclick="Admin.runAuto()">СТАРТ (12 ВОПР)</button>
            <button class="a-btn danger" onclick="Admin.reset()">СБРОС ВСЕГО</button>
        </div>
    </nav>

    <div id="app-viewport">
        <!-- ЭКРАН ЛОББИ -->
        <section id="view-lobby" class="screen active">
            <div class="k-logo">1C: Quiz</div>
            <div id="join-card" class="glass-card">
                <input type="text" id="p-nick" placeholder="Введите имя (необяз.)">
                <button onclick="handleJoinBtn()" class="btn-hit">ИГРАТЬ!</button>
            </div>
            <div id="online-counter" class="pulse-text">Подключение...</div>
            <div id="player-tags" class="scroll-zone"></div>
        </section>

        <!-- ПРИГОТОВЬТЕСЬ -->
        <section id="view-getready" class="screen">
            <h1 class="prep-text pulse-animation">ПРИГОТОВЬТЕСЬ!</h1>
            <div class="winner-row place-1">Смотрите на экран...</div>
        </section>

        <!-- ВОПРОС -->
        <section id="view-game" class="screen">
            <div class="question-overlay"><h2 id="q-text">Загрузка...</h2></div>
            <div class="game-hud">
                <div class="timer-orb"><span id="timer-sec">20</span></div>
                <div class="stats-pill"><span id="ans-count">0</span> ответов</div>
            </div>
            <div class="answers-grid" id="ans-grid">
                <button class="ans-btn r" onclick="User.hit(0)"><span class="s">▲</span><span class="t"></span></button>
                <button class="ans-btn b" onclick="User.hit(1)"><span class="s">◆</span><span class="t"></span></button>
                <button class="ans-btn y" onclick="User.hit(2)"><span class="s">●</span><span class="t"></span></button>
                <button class="ans-btn g" onclick="User.hit(3)"><span class="s">■</span><span class="t"></span></button>
            </div>
        </section>

        <!-- РЕЗУЛЬТАТЫ -->
        <section id="view-results" class="screen">
            <div class="feedback-card">
                <h1 id="fb-main">ВРЕМЯ ВЫШЛО</h1>
                <div class="stats-container">
                    <div class="stat-col"><span id="count-0">0</span><div id="bar-0" class="bar r-bar"></div><span class="shape-min">▲</span></div>
                    <div class="stat-col"><span id="count-1">0</span><div id="bar-1" class="bar b-bar"></div><span class="shape-min">◆</span></div>
                    <div class="stat-col"><span id="count-2">0</span><div id="bar-2" class="bar y-bar"></div><span class="shape-min">●</span></div>
                    <div class="stat-col"><span id="count-3">0</span><div id="bar-3" class="bar g-bar"></div><span class="shape-min">■</span></div>
                </div>
            </div>
            <div id="round-leaderboard" class="scroll-list"></div>
        </section>

        <!-- ФИНАЛ -->
        <section id="view-podium" class="screen">
            <div class="k-logo">🏆 ФИНАЛ</div>
            <div id="podium-final" class="scroll-list"></div>
            <button class="btn-hit" style="margin-top:20px; width:auto; padding:15px 40px;" onclick="User.logout()">ВЫЙТИ</button>
        </section>
    </div>

    <script src="sounds.js"></script>
    <script src="game.js"></script>
</body>
</html>
