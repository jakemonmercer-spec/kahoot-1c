<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1C:Enterprise Quiz Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrPKRi5NWA7JRcdbA2YLO4HPR3ULaBlGk",
            authDomain: "quiz1c.firebaseapp.com",
            databaseURL: "https://quiz1c-default-rtdb.firebaseio.com",
            projectId: "quiz1c",
            storageBucket: "quiz1c.firebasestorage.app",
            messagingSenderId: "660786627580",
            appId: "1:660786627580:web:6a552159559d0eef426879"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>
</head>
<body>

    <!-- ПАНЕЛЬ АДМИНИСТРАТОРА (Пароль: 123) -->
    <div id="admin-dashboard">
        <div id="admin-login">
            <input type="password" id="adm-pass" placeholder="Admin PIN">
            <button onclick="Admin.login()">Unlock</button>
        </div>
        <div id="admin-tools" style="display:none;">
            <button class="a-btn" onclick="Admin.setStep('lobby')">LOBBY</button>
            <button class="a-btn start" onclick="Admin.runAuto()">AUTO START</button>
            <button class="a-btn" onclick="Admin.next()">MANUAL NEXT</button>
            <button class="a-btn reset" onclick="Admin.reset()">RESET</button>
            <span id="game-status">Status: Waiting</span>
        </div>
    </div>

    <div id="game-container">
        <!-- ЭКРАН 1: ВХОД (ЛОББИ) -->
        <section id="screen-lobby" class="screen active">
            <div class="kahoot-logo">1C: Quiz</div>
            <div class="auth-card" id="player-auth-form">
                <input type="text" id="p-name" placeholder="Введите имя...">
                <button class="btn-main" onclick="Game.join()">OK, GO!</button>
            </div>
            <div id="lobby-list-container">
                <div id="player-count">0 Players</div>
                <div id="player-tags"></div>
            </div>
        </section>

        <!-- ЭКРАН 2: ОЖИДАНИЕ ВОПРОСА -->
        <section id="screen-getready" class="screen">
            <h1 class="pulse">Приготовьтесь...</h1>
            <div id="player-personal-score">Баллы: 0</div>
        </section>

        <!-- ЭКРАН 3: ВОПРОС -->
        <section id="screen-question" class="screen">
            <div class="q-header"><h2 id="q-text">Текст вопроса</h2></div>
            <div class="q-ui">
                <div class="timer-ring"><span id="timer-sec">20</span></div>
                <div class="q-image"><img src="https://1c.ru/images/logos/1c_eng.png"></div>
                <div class="ans-counter"><span id="ans-received">0</span><br>Answers</div>
            </div>
            <div class="answers-grid" id="ans-grid">
                <button class="ans-item r" onclick="Game.hit(0)"><span class="sh">▲</span><span class="tx"></span></button>
                <button class="ans-item b" onclick="Game.hit(1)"><span class="sh">◆</span><span class="tx"></span></button>
                <button class="ans-item y" onclick="Game.hit(2)"><span class="sh">●</span><span class="tx"></span></button>
                <button class="ans-item g" onclick="Game.hit(3)"><span class="sh">■</span><span class="tx"></span></button>
            </div>
        </section>

        <!-- ЭКРАН 4: РЕЗУЛЬТАТЫ ВОПРОСА -->
        <section id="screen-results" class="screen">
            <h2 id="feedback-text">Время вышло!</h2>
            <div id="top-score-list"></div>
        </section>

        <!-- ЭКРАН 5: ПОДИУМ -->
        <section id="screen-podium" class="screen">
            <h1>🏆 TOP 5 🏆</h1>
            <div id="final-podium"></div>
        </section>
    </div>

    <script src="game.js"></script>
</body>
</html>
