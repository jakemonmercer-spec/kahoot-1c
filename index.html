<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1C: Kahoot Clone - Lab 6</title>
    
    <!-- Стили -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>1С: Квиз - Лабораторная №6</h1>
    </header>

    <!-- Экран входа -->
    <section id="auth-screen" class="card">
        <h2>Добро пожаловать!</h2>
        <input type="text" id="username" placeholder="Введите ваш Nickname">
        <button class="ans-btn ans-1" style="width:100%; display:block;" onclick="joinGame()">ВОЙТИ В ИГРУ</button>
    </section>

    <!-- Игровой экран -->
    <section id="game-screen" style="display:none;">
        <div id="timer-circle">20</div>
        <h2 id="question-text">Загрузка вопроса...</h2>
        
        <div id="answers-grid" class="grid"></div>

        <div class="leaderboard-container">
            <h3>🏆 Топ студентов:</h3>
            <ul id="leaderboard"></ul>
        </div>
    </section>

    <!-- Панель управления (для тебя) -->
    <footer class="admin-panel">
        <h4>Панель ведущего</h4>
        <div id="admin-btns"></div>
        <button onclick="resetAll()" style="background:red; color:white; border:none; padding:10px; margin-top:15px; border-radius:5px; cursor:pointer;">Сбросить игру</button>
    </footer>
</div>

    <!-- Твои скрипты -->
    <script src="firebase-config.js"></script>
    <script src="game.js"></script>
</body>
</html>
