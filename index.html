<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Мета-теги для полной блокировки зума и адаптации под вырезы (челки) iPhone -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>1C: Enterprise Quiz Ultimate</title>
    
    <!-- Стили -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        // --- ЦЕНТРАЛЬНОЕ ЯДРО (Firebase) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBrPKRi5NWA7JRcdbA2YLO4HPR3ULaBlGk",
            authDomain: "quiz1c.firebaseapp.com",
            databaseURL: "https://quiz1c-default-rtdb.firebaseio.com",
            projectId: "quiz1c",
            storageBucket: "quiz1c.firebasestorage.app",
            messagingSenderId: "660786627580",
            appId: "1:660786627580:web:6a552159559d0eef426879",
            measurementId: "G-JYTEXXW2BD"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>
</head>
<body oncontextmenu="return false;"> <!-- Запрет вызова меню правой кнопкой на мобилках -->

    <!-- 1. ПАНЕЛЬ УПРАВЛЕНИЯ ПРЕПОДАВАТЕЛЯ -->
    <nav id="admin-pwa-bar">
        <div id="auth-lock">
            <input type="password" id="pin" placeholder="PIN">
            <button onclick="Admin.login()">OK</button>
        </div>
        <div id="adm-tools" style="display:none;">
            <button class="a-btn" onclick="Admin.setStep('lobby')">ЛОББИ</button>
            <button class="a-btn primary" onclick="Admin.runAuto()">АВТО-СТАРТ</button>
            <button class="a-btn danger" onclick="Admin.reset()">СБРОС БАЗЫ</button>
            <span style="color:#ffcc00; font-size:10px; margin-left:10px; font-weight:800;">SYNC ON</span>
        </div>
    </nav>

    <!-- 2. ГЛАВНЫЙ КОНТЕЙНЕР ПРИЛОЖЕНИЯ -->
    <div id="app-viewport">
        
        <!-- ЭКРАН 1: ЛОББИ (Оптимизированный) -->
<section id="view-lobby" class="screen active">
    <div class="k-logo">1C: Quiz</div>
    
    <div id="join-card" class="glass-card">
        <!-- Ввод имени удален для быстрого входа -->
       
        <button onclick="User.join()" class="btn-hit">ВСТУПИТЬ В ИГРУ</button>
        <p style="color: #666; margin-top: 15px; font-size: 0.8rem; font-weight: 600;">Никнейм будет назначен автоматически</p>
         <button onclick="document.getElementById('donate-modal').style.display='flex'" class="btn-donate">На хлеб 🍞</button>
    </div>
    
    <div id="online-counter" style="margin-top: 15px; font-weight: 800; font-size: 0.9rem;">Подключение к серверу...</div>
    
    <div id="player-tags"></div>
</section>

        <!-- ЭКРАН 2: ПРИГОТОВЬТЕСЬ -->
        <section id="view-getready" class="screen">
            <h1 class="prep-text pulse" style="font-size: clamp(2rem, 8vw, 5rem);">ПРИГОТОВЬТЕСЬ!</h1>
            <div id="p-score-now" class="winner-row" style="background: white; color: black; margin-top: 20px; font-size: 1.2rem;">
                Готовим следующий вопрос...
            </div>
        </section>

        <!-- ЭКРАН 3: ВОПРОС -->
        <section id="view-game" class="screen">
            <div class="question-overlay">
                <h2 id="q-text">Загрузка вопроса...</h2>
            </div>
            
            <div class="game-hud">
                <div class="timer-orb">
                    <span id="timer-sec">20</span>
                </div>
                <div class="stats-pill">
                    <span id="ans-count">0</span> ответов
                </div>
            </div>

            <div class="answers-grid" id="ans-grid">
                <button class="ans-btn r" onclick="User.hit(0)">
                    <span class="s">▲</span><span class="t"></span>
                </button>
                <button class="ans-btn b" onclick="User.hit(1)">
                    <span class="s">◆</span><span class="t"></span>
                </button>
                <button class="ans-btn y" onclick="User.hit(2)">
                    <span class="s">●</span><span class="t"></span>
                </button>
                <button class="ans-btn g" onclick="User.hit(3)">
                    <span class="s">■</span><span class="t"></span>
                </button>
            </div>
        </section>

        <!-- ЭКРАН 4: СТАТИСТИКА И РЕЙТИНГ -->
        <section id="view-results" class="screen">
            <div class="feedback-card">
                <h1 id="fb-main" style="font-size: 1.5rem;">Время вышло!</h1>
                
                <div class="stats-container" style="display:flex; align-items:flex-end; justify-content:center; gap:12px; height: 100px; margin-top: 15px;">
                    <div class="stat-col"><span id="count-0">0</span><div id="bar-0" class="bar r-bar"></div><span>▲</span></div>
                    <div class="stat-col"><span id="count-1">0</span><div id="bar-1" class="bar b-bar"></div><span>◆</span></div>
                    <div class="stat-col"><span id="count-2">0</span><div id="bar-2" class="bar y-bar"></div><span>●</span></div>
                    <div class="stat-col"><span id="count-3">0</span><div id="bar-3" class="bar g-bar"></div><span>■</span></div>
                </div>
            </div>

            <div id="round-leaderboard" class="scroll-list">
                <!-- Рейтинг ВСЕХ игроков -->
            </div>
        </section>

        <!-- ЭКРАН 5: ФИНАЛ -->
        <section id="view-podium" class="screen">
            <div class="k-logo" style="font-size: clamp(2rem, 8vw, 4rem);">🏆 ФИНАЛ 🏆</div>
            <div id="podium-final" class="scroll-list" style="max-height: 50dvh;">
                <!-- Итоговый ТОП -->
            </div>
            <button class="btn-hit" style="margin-top: 20px; width: auto; padding: 12px 40px;" onclick="location.reload()">ЗАНОВО</button>
        </section>

    </div>
<div id="donate-modal" class="modal-overlay" onclick="this.style.display='none'">
    <div class="modal-card" onclick="event.stopPropagation()">
        <h3>Поддержать автора 🍞</h3>
        <p>На свежий хлеб и кофе для кодинга</p>
        <!-- Положи файл qr.jpg (твое фото) в папку с проектом -->
        <img src="qr.jpg" alt="QR Code" class="qr-img">
        <button class="btn-hit" onclick="document.getElementById('donate-modal').style.display='none'">Закрыть</button>
    </div>
</div>
    
    <!-- СКРИПТЫ -->
    <script src="sounds.js"></script>
    <script src="game.js"></script>

</body>
</html>
