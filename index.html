<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>1C:Enterprise Quiz Pro</title>
    
    <!-- Подключение стилей и шрифтов -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (Версия Compat для стабильной работы на GitHub Pages) -->
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        // ИНИЦИАЛИЗАЦИЯ БАЗЫ ДАННЫХ (ЯДРО)
        const firebaseConfig = {
            apiKey: "AIzaSyBrPKRi5NWA7JRcdbA2YLO4HPR3ULaBlGk",
            authDomain: "quiz1c.firebaseapp.com",
            databaseURL: "https://quiz1c-default-rtdb.firebaseio.com",
            projectId: "quiz1c",
            storageBucket: "quiz1c.firebasestorage.app",
            messagingSenderId: "660786627580",
            appId: "1:660786627580:web:6a552159559d0eef426879",
            measurementId: "G-JYTEXXW2BD"
        };

        // Запуск Firebase ПЕРЕД загрузкой интерфейса
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>
</head>
<body>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ ПРЕПОДАВАТЕЛЯ -->
    <nav id="admin-pwa-bar">
        <div id="auth-lock">
            <input type="password" id="pin" placeholder="PIN">
            <button onclick="Admin.login()">Unlock</button>
        </div>
        <div id="adm-tools" style="display:none;">
            <button class="a-btn" onclick="Admin.setStep('lobby')">LOBBY</button>
            <button class="a-btn primary" onclick="Admin.runAuto()">AUTO START</button>
            <button class="a-btn danger" onclick="Admin.reset()">RESET</button>
            <span id="game-status" style="margin-left:10px; font-size:10px; color:#ffcc00;">Online</span>
        </div>
    </nav>

    <div id="app-viewport">
        
        <!-- ЭКРАН 1: ЛОББИ (Вход в игру) -->
        <section id="view-lobby" class="screen active">
            <div class="k-logo">1C: Quiz</div>
            <div id="join-card" class="glass-card">
                <input type="text" id="p-nick" placeholder="Твое имя...">
                <button onclick="User.join()" class="btn-hit">ИГРАТЬ</button>
            </div>
            <div id="online-counter">0 игроков онлайн</div>
            <div id="player-tags">
                <!-- Сюда JS будет рендерить ники вошедших студентов -->
            </div>
        </section>

        <!-- ЭКРАН 2: ОЖИДАНИЕ (Get Ready) -->
        <section id="view-getready" class="screen">
            <h1 class="prep-text pulse">ПРИГОТОВЬТЕСЬ...</h1>
            <div class="user-score-bubble" id="p-score-now">Баллы: 0</div>
        </section>

        <!-- ЭКРАН 3: ВОПРОС (Game) -->
        <section id="view-game" class="screen">
            <div class="question-overlay">
                <h2 id="q-text">Загрузка вопроса...</h2>
            </div>
            
            <div class="game-hud">
                <div class="timer-orb" id="t-orb">
                    <span id="timer-sec">20</span>
                </div>
                <div class="stats-pill">
                    <span id="ans-count">0</span> ответов
                </div>
            </div>

            <div class="answers-grid" id="ans-grid">
                <button class="ans-btn r" onclick="User.hit(0)">
                    <span class="s">▲</span><span class="t">Вариант 1</span>
                </button>
                <button class="ans-btn b" onclick="User.hit(1)">
                    <span class="s">◆</span><span class="t">Вариант 2</span>
                </button>
                <button class="ans-btn y" onclick="User.hit(2)">
                    <span class="s">●</span><span class="t">Вариант 3</span>
                </button>
                <button class="ans-btn g" onclick="User.hit(3)">
                    <span class="s">■</span><span class="t">Вариант 4</span>
                </button>
            </div>
        </section>

        <!-- ЭКРАН 4: РЕЗУЛЬТАТЫ РАУНДА (Results) -->
        <section id="view-results" class="screen">
            <div id="feedback-wrap" class="feedback-card">
                <h1 id="fb-main">Время вышло!</h1>
                <p>Текущий рейтинг группы:</p>
            </div>
            <div id="round-leaderboard">
                <!-- Сюда JS выведет ТОП-5 после вопроса -->
            </div>
        </section>

        <!-- ЭКРАН 5: ПОДИУМ (Финал) -->
        <section id="view-podium" class="screen">
            <h1 class="podium-title">🏆 ФИНАЛЬНЫЙ ТОП 🏆</h1>
            <div id="podium-final">
                <!-- Итоговые победители -->
            </div>
            <button class="btn-hit" style="margin-top: 20px; width: auto;" onclick="location.reload()">На главную</button>
        </section>

    </div>

    <!-- Подключение логики (в самом конце для быстрой отрисовки HTML) -->
    <script src="game.js"></script>
</body>
</html>
