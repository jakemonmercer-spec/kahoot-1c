<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1C: Kahoot Auto-Pilot</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrPKRi5NWA7JRcdbA2YLO4HPR3ULaBlGk",
            authDomain: "quiz1c.firebaseapp.com",
            databaseURL: "https://quiz1c-default-rtdb.firebaseio.com",
            projectId: "quiz1c",
            storageBucket: "quiz1c.firebasestorage.app",
            messagingSenderId: "660786627580",
            appId: "1:660786627580:web:6a552159559d0eef426879",
            measurementId: "G-JYTEXXW2BD"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>
</head>
<body>

    <nav id="admin-bar">
        <div id="auth-zone">
            <input type="password" id="adm-pass" placeholder="Pass">
            <button onclick="authAdmin()">Login</button>
        </div>
        <div id="adm-ctrl" style="display:none;">
            <button class="a-btn" onclick="setStep('lobby')">ОТКРЫТЬ ЛОББИ</button>
            <button class="a-btn start" onclick="startAutoQuiz()">ЗАПУСТИТЬ АВТО-КВИЗ</button>
            <button class="a-btn" onclick="systemReset()">СБРОС</button>
        </div>
    </nav>

    <div id="stage">
        <!-- ОЖИДАНИЕ -->
        <section id="view-wait" class="view active">
            <div class="k-logo">1C: QUIZ</div>
            <div class="loader">Ожидание преподавателя...</div>
        </section>

        <!-- ЛОББИ -->
        <section id="view-lobby" class="view">
            <div id="join-ui">
                <div class="card">
                    <h2>Входи в игру!</h2>
                    <input type="text" id="player-nick" placeholder="Твой ник">
                    <button class="btn-primary" onclick="join()">ИГРАТЬ</button>
                </div>
            </div>
            <div id="lobby-players"></div>
        </section>

        <!-- ИГРА -->
        <section id="view-game" class="view">
            <div class="q-box"><h1 id="q-text">...</h1></div>
            <div class="timer-bar"><div id="timer-fill"></div></div>
            <div class="game-info">
                <div class="t-val" id="timer-sec">20</div>
                <div id="ans-stat">0 Answers</div>
            </div>
            <div class="grid" id="ans-grid">
                <button class="ans-btn r" onclick="hit(0)"><span class="s">▲</span><span class="t"></span></button>
                <button class="ans-btn b" onclick="hit(1)"><span class="s">◆</span><span class="t"></span></button>
                <button class="ans-btn y" onclick="hit(2)"><span class="s">●</span><span class="t"></span></button>
                <button class="ans-btn g" onclick="hit(3)"><span class="s">■</span><span class="t"></span></button>
            </div>
        </section>

        <!-- ПОДВЕДЕНИЕ ИТОГОВ -->
        <section id="view-results" class="view">
            <h1 id="res-status">Правильный ответ!</h1>
            <div id="score-feed"></div>
        </section>

        <!-- ПЬЕДЕСТАЛ -->
        <section id="view-podium" class="view">
            <h1>🏆 ФИНАЛ 🏆</h1>
            <div id="podium-list"></div>
        </section>
    </div>

    <script src="game.js"></script>
</body>
</html>
