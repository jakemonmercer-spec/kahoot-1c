<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>1C: Enterprise Quiz Ultimate</title>
    
    <!-- Стили -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (Версии Compat для работы на GitHub Pages) -->
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        // --- ЦЕНТРАЛЬНАЯ КОНФИГУРАЦИЯ (БАЗА) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBrPKRi5NWA7JRcdbA2YLO4HPR3ULaBlGk",
            authDomain: "quiz1c.firebaseapp.com",
            databaseURL: "https://quiz1c-default-rtdb.firebaseio.com",
            projectId: "quiz1c",
            storageBucket: "quiz1c.firebasestorage.app",
            messagingSenderId: "660786627580",
            appId: "1:660786627580:web:6a552159559d0eef426879",
            measurementId: "G-JYTEXXW2BD"
        };

        // Инициализация базы данных
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ ПРЕПОДАВАТЕЛЯ (Админка) -->
    <nav id="admin-pwa-bar">
        <div id="auth-lock">
            <input type="password" id="pin" placeholder="PIN">
            <button onclick="Admin.login()">Unlock</button>
        </div>
        <div id="adm-tools" style="display:none;">
            <button class="a-btn" onclick="Admin.setStep('lobby')">ЛОББИ</button>
            <button class="a-btn primary" onclick="Admin.runAuto()">AUTO START</button>
            <button class="a-btn danger" onclick="Admin.reset()">RESET SYSTEM</button>
            <span id="game-status" style="margin-left:10px; font-size:10px; color:#ffcc00; font-weight:bold;">• SYNC ACTIVE</span>
        </div>
    </nav>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР ЭКРАНОВ -->
    <div id="app-viewport">
        
        <!-- ЭКРАН 1: ЛОББИ (Вход в игру) -->
        <section id="view-lobby" class="screen active">
            <div class="k-logo">1C: Quiz</div>
            
            <div id="join-card" class="glass-card">
                <input type="text" id="p-nick" placeholder="Твое имя...">
                <button onclick="User.join()" class="btn-hit">ИГРАТЬ</button>
            </div>
            
            <div id="online-counter">Синхронизация...</div>
            
            <div id="player-tags">
                <!-- Сюда JS отрисует ники игроков в реальном времени -->
            </div>
        </section>

        <!-- ЭКРАН 2: ПРИГОТОВЬТЕСЬ (Get Ready) -->
        <section id="view-getready" class="screen">
            <h1 class="prep-text pulse">ПРИГОТОВЬТЕСЬ...</h1>
            <div id="p-score-now" class="winner-row" style="background: white; color: black; margin-top: 20px;">
                Загрузка данных...
            </div>
        </section>

        <!-- ЭКРАН 3: ВОПРОС (Синхронная игра) -->
        <section id="view-game" class="screen">
            <div class="question-overlay">
                <h2 id="q-text">Загрузка вопроса...</h2>
            </div>
            
            <div class="game-hud">
                <div class="timer-orb">
                    <span id="timer-sec">20</span>
                </div>
                <div class="stats-pill">
                    <span id="ans-count">0</span> ответов
                </div>
            </div>

            <div class="answers-grid" id="ans-grid">
                <!-- Кнопки в стиле Kahoot с геометрическими фигурами -->
                <button class="ans-btn r" onclick="User.hit(0)">
                    <span class="s">▲</span><span class="t"></span>
                </button>
                <button class="ans-btn b" onclick="User.hit(1)">
                    <span class="s">◆</span><span class="t"></span>
                </button>
                <button class="ans-btn y" onclick="User.hit(2)">
                    <span class="s">●</span><span class="t"></span>
                </button>
                <button class="ans-btn g" onclick="User.hit(3)">
                    <span class="s">■</span><span class="t"></span>
                </button>
            </div>
        </section>

        <!-- ЭКРАН 4: РЕЗУЛЬТАТЫ РАУНДА (Results) -->
        <section id="view-results" class="screen">
            <div class="feedback-card">
                <h1 id="fb-main">Время вышло!</h1>
                <p>Лидеры этого раунда:</p>
            </div>
            <div id="round-leaderboard" style="width: 100%; max-width: 500px;">
                <!-- Сюда JS выводит ТОП-5 -->
            </div>
        </section>

        <!-- ЭКРАН 5: ПОДИУМ (Финал с Конфетти) -->
        <section id="view-podium" class="screen">
            <h1 class="podium-title" style="font-size: 3.5rem;">🏆 ФИНАЛ 🏆</h1>
            <div id="podium-final" style="width: 100%; max-width: 600px;">
                <!-- Победители Квиза по Лабе №6 -->
            </div>
            <button class="btn-hit" style="margin-top: 30px; width: auto; padding: 15px 40px;" onclick="location.reload()">НОВАЯ ИГРА</button>
        </section>

    </div>

    <!-- ПОРЯДОК ЗАГРУЗКИ СКРИПТОВ (ВАЖНО ДЛЯ БЕЗЛАГОВОЙ РАБОТЫ) -->
    <!-- 1. Звуковой движок -->
    <script src="sounds.js"></script>
    <!-- 2. Главная логика, синхронизация и защита -->
    <script src="game.js"></script>

</body>
</html>
