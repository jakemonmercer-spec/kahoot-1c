<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1C Enterprise Quiz Ultimate</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrPKRi5NWA7JRcdbA2YLO4HPR3ULaBlGk",
            authDomain: "quiz1c.firebaseapp.com",
            databaseURL: "https://quiz1c-default-rtdb.firebaseio.com",
            projectId: "quiz1c",
            storageBucket: "quiz1c.firebasestorage.app",
            messagingSenderId: "660786627580",
            appId: "1:660786627580:web:6a552159559d0eef426879"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>
</head>
<body>

    <div id="admin-pwa-bar">
        <div id="auth-lock">
            <input type="password" id="pin" placeholder="PIN">
            <button onclick="Admin.auth()">OK</button>
        </div>
        <div id="adm-tools" style="display:none;">
            <button onclick="Admin.setStep('lobby')">ЛОББИ</button>
            <button class="primary" onclick="Admin.run()">АВТО-СТАРТ</button>
            <button class="danger" onclick="Admin.clear()">СБРОС</button>
        </div>
    </div>

    <div id="app-viewport">
        <!-- ЛОББИ -->
        <section id="view-lobby" class="screen active">
            <div class="k-logo">1C: Quiz</div>
            <div id="join-card" class="glass-card">
                <input type="text" id="p-nick" placeholder="Твое имя...">
                <button onclick="User.join()" class="btn-hit">ИГРАТЬ</button>
            </div>
            <div id="online-counter">0 игроков онлайн</div>
            <div id="player-tags"></div>
        </section>

        <!-- ОЖИДАНИЕ -->
        <section id="view-getready" class="screen">
            <h1 class="prep-text">ПРИГОТОВЬТЕСЬ...</h1>
            <div class="user-score-bubble" id="p-score-now">Баллы: 0</div>
        </section>

        <!-- ВОПРОС -->
        <section id="view-game" class="screen">
            <div class="question-overlay">
                <h2 id="q-text">Загрузка вопроса...</h2>
            </div>
            <div class="game-hud">
                <div class="timer-orb" id="t-orb">20</div>
                <div class="stats-pill"><span id="ans-count">0</span> ответов</div>
            </div>
            <div class="answers-grid" id="ans-grid">
                <button class="ans-btn r" onclick="User.hit(0)"><span class="s">▲</span><span class="t"></span></button>
                <button class="ans-btn b" onclick="User.hit(1)"><span class="s">◆</span><span class="t"></span></button>
                <button class="ans-btn y" onclick="User.hit(2)"><span class="s">●</span><span class="t"></span></button>
                <button class="ans-btn g" onclick="User.hit(3)"><span class="s">■</span><span class="t"></span></button>
            </div>
        </section>

        <!-- ФИДБЕК (ПРАВИЛЬНО/НЕТ) -->
        <section id="view-results" class="screen">
            <div id="feedback-wrap" class="feedback-card">
                <h1 id="fb-main">Результаты</h1>
                <div id="fb-score">+0 баллов</div>
            </div>
            <div id="round-leaderboard"></div>
        </section>

        <!-- ПОДИУМ -->
        <section id="view-podium" class="screen">
            <h1 class="podium-title">🏆 ТОП-5 🏆</h1>
            <div id="podium-final"></div>
        </section>
    </div>

    <script src="game.js"></script>
</body>
</html>
